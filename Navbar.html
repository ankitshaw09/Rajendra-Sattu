<!-- Navbar Logic -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    // 1. Handle Mobile Menu Toggle
    const menuToggleBtn = document.getElementById('mobile-menu-toggle');
    const mobileMenu = document.getElementById('mobile-menu');

    menuToggleBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
      mobileMenu.classList.toggle('flex');
      // Change icon from 'menu' to 'close' based on state
      menuToggleBtn.textContent = mobileMenu.classList.contains('hidden') ? 'menu' : 'close';
    });

    // 2. Automatically Highlight the Active Page Link
    // Get the current filename (e.g., "product.html"). If empty (like "www.site.com/"), default to "index.html"
    const currentPath = window.location.pathname.split('/').pop() || 'index.html';
    const navLinks = document.querySelectorAll('.nav-link');

    navLinks.forEach(link => {
      const href = link.getAttribute('href');
      // If the link's href matches the current URL path
      if (href === currentPath) {
        // Remove inactive styles
        link.classList.remove('text-[#50453b]', 'hover:text-[#795900]', 'border-transparent');
        // Add active state styles
        link.classList.add('text-[#795900]', 'font-bold', 'border-[#795900]');
      }
    });
  });
</script>
